name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Android SDK 步骤放在 setup-java 之前：用 runner 默认 JDK 17 跑 sdkmanager
      # （cmdline-tools 12+ 要求 JDK 17+）
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-31" "build-tools;31.0.0" "build-tools;30.0.3" "platform-tools" || true

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      # 构建用 JDK 11（AGP 7.1 / Gradle 7.2 wrapper 的标准组合）
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle (wrapper)
        uses: gradle/actions/setup-gradle@v3

      # 从 GitHub Secrets 还原签名密钥并生成 keystore.properties
      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > folatkikoeru-release.jks
          cat > keystore.properties <<EOF
          storeFile=../folatkikoeru-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/31.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: folatkikoeru-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
